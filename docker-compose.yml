services:
  ultron-backend:
    build:
      context: .
      dockerfile: ultron-backend/Dockerfile
    container_name: ultron-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ULTRON_DB_PATH=/data/ultron.db
      # Activity/chat/metrics timestamps are written with the container's
      # clock; without this they were UTC while everything else on the
      # dashboard (and the Pi-hole/Jellyfin stacks) is local time.
      - TZ=America/Los_Angeles
      # Real TLS cert issued by `tailscale cert` for this device's
      # *.ts.net name (owner-requested 2026-09-16) -- see the tls/
      # volume mount below and ultron-backend/tls/README.md for how to
      # (re)generate it. Empty/missing files fall back to plain HTTP,
      # per app.py's own check.
      - ULTRON_TLS_CERT=/app/tls/ultron.crt
      - ULTRON_TLS_KEY=/app/tls/ultron.key
    volumes:
      # Ultron's learned/gathered data (trades, memory notes, evolution
      # ideas, metrics history, activity log -- everything in ultron.db)
      # lives on the host at a real, browsable path instead of inside
      # Docker's own hidden volume storage. Host-specific, so it's a
      # variable sourced from the untracked .env (set
      # ULTRON_DATA_DIR there) rather than hardcoded here -- this repo
      # is public, and other clones won't have this exact path.
      - "${ULTRON_DATA_DIR}:/data"
      # Host-issued TLS material, gitignored/dockerignored (never baked
      # into the image or committed) -- read-only, this container only
      # ever reads it.
      - "./ultron-backend/tls:/app/tls:ro"
      # Lets Ultron see/manage sibling containers on the host (docker_ps,
      # docker_stats, CVE scan, deploy-container). Whoever can write to
      # this socket has root-equivalent power over the whole Docker host —
      # that's inherent to the socket, not something a non-root container
      # user would meaningfully reduce, which is why this container runs
      # as root. The app's own require_role() gate is what actually keeps
      # beta-tester tokens away from the endpoints that use it.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ultron

  ultron-discord-bot:
    build:
      context: ultron-discord-bot
    container_name: ultron-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # https, not http, since the backend now serves TLS-only on this
      # port (ULTRON_TLS_CERT/KEY above) -- see bot.py's setup_hook for
      # why this connection skips cert-hostname verification.
      - ULTRON_BACKEND_URL=https://ultron-backend:5000
      - TZ=America/Los_Angeles
    depends_on:
      - ultron-backend
    networks:
      - ultron

  # Scout's search engine (owner-approved 2026-09-16): a private, self-hosted
  # SearXNG the backend's web_search chat tool queries. Free, no account,
  # no per-query cost. Deliberately NOT published on any host port -- only
  # ultron-backend can reach it, over the ultron network, so it is never a
  # search box exposed to the LAN or the tailnet. settings.yml enables the
  # JSON format the tool needs and turns the rate limiter off (it would
  # otherwise want a Valkey/Redis container for one internal caller).
  searxng:
    image: searxng/searxng:latest
    container_name: ultron-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Add SEARXNG_SECRET to .env (any long random string)}
      - TZ=America/Los_Angeles
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - ultron

networks:
  ultron:
    driver: bridge
